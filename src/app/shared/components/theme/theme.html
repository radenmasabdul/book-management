<button
  type="button"
  class="inline-flex size-10 items-center justify-center rounded-lg text-muted-foreground transition-colors
    cursor-pointer hover:bg-accent hover:text-accent-foreground
  "
  [attr.aria-label]=" theme() === 'dark'
    ? 'Switch to light mode'
    : 'Switch to dark mode'
  "
  [attr.title]=" theme() === 'dark'
    ? 'Switch to light mode'
    : 'Switch to dark mode'
  "
  (click)="toggleTheme()"
>
  @if (theme() === 'dark') {
    <ng-icon name="lucideSun" size="20" aria-hidden="true" />
  } @else {
    <ng-icon name="lucideMoon" size="20" aria-hidden="true" />
  }
</button>
