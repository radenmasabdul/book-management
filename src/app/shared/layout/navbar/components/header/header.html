<div class="flex min-w-0 items-center gap-3">
  <button
    type="button"
    class="inline-flex size-10 shrink-0 items-center justify-center rounded-lg text-muted-foreground
      transition-colors cursor-pointer hover:bg-accent hover:text-accent-foreground lg:hidden
    "
    aria-label="Toggle navigation menu"
    [attr.aria-expanded]="isMobileMenuOpen"
    (click)="onMenuClick()"
  >
    @if (isMobileMenuOpen) {
      <ng-icon name="lucideX" size="22" aria-hidden="true" />
    } @else {
      <ng-icon name="lucideMenu" size="22" aria-hidden="true" />
    }
  </button>
  
  <a
    routerLink="/dashboard"
    class="flex min-w-0 items-center gap-2.5 rounded-lg"
    (click)="closeMobileMenu()"
  >
    <div class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-foreground">
      <ng-icon name="lucideBookOpen" size="23" aria-hidden="true" />
    </div>
  
    <div class="min-w-0">
      <span class="block truncate text-base font-bold tracking-tight text-foreground">
        Book Management
      </span>
      
      <span class="hidden text-xs text-muted-foreground sm:block">
        Library administration
      </span>
    </div>
  </a>
</div>
