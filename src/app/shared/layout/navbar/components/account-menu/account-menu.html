<div class="relative ml-1">
  <button
    type="button"
    class="flex max-w-52 items-center gap-2 rounded-xl border border-border px-2 py-1.5 transition-colors
      cursor-pointer hover:bg-accent sm:gap-3 sm:px-3
    "
    aria-haspopup="true"
    [attr.aria-expanded]="isDropdownOpen()"
    (click)="toggleDropdown()"
  >
    <div class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary text-sm font-semibold text-primary-foreground">
      {{ currentUser()?.name?.charAt(0)?.toUpperCase() ?? 'U' }}
    </div>

    <div class="hidden min-w-0 text-left md:block">
      <p class="truncate text-sm font-semibold text-foreground">
        {{ currentUser()?.name ?? 'User' }}
      </p>

      <p class="truncate text-xs text-muted-foreground">
        {{ currentUser()?.email ?? '' }}
      </p>
    </div>

    <ng-icon name="lucideChevronDown" size="16" class="hidden shrink-0 text-muted-foreground sm:block" aria-hidden="true" />
  </button>

  @if (isDropdownOpen()) {
    <div
      class="absolute right-0 top-full z-50 mt-2 w-64 overflow-hidden rounded-xl border border-border bg-popover
        text-popover-foreground shadow-lg
      "
      role="menu"
    >
      <div class="border-b border-border px-4 py-3">
        <p class="truncate text-sm font-semibold">
          {{ currentUser()?.name ?? 'User' }}
        </p>
  
        <p class="mt-1 truncate text-xs text-muted-foreground">
          {{ currentUser()?.email ?? '' }}
        </p>
  
        <div class="mt-2 flex flex-wrap gap-1">
          @for (
            role of currentUser()?.roles ?? [];
            track role
          ) {
            <span class="rounded-md bg-accent px-2 py-1 text-xs font-medium text-accent-foreground">
              {{ role }}
            </span>
          }
        </div>
      </div>
      
      <div class="p-1.5">
        <a
          routerLink="/profile"
          role="menuitem"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition-colors hover:bg-accent hover:text-accent-foreground"
          (click)="closeDropdown()"
        >
          <ng-icon name="lucideUserRound" size="18" aria-hidden="true" />
          Profile
        </a>
  
        <a
          routerLink="/settings"
          role="menuitem"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition-colors hover:bg-accent hover:text-accent-foreground"
          (click)="closeDropdown()"
        >
          <ng-icon name="lucideSettings" size="18" aria-hidden="true" />
          Settings
        </a>
      </div>
      
      <div class="border-t border-border p-1.5">
        @if (logoutError()) {
          <p class="px-3 py-2 text-xs text-destructive" role="alert">
            {{ logoutError() }}
          </p>
        }
      
        <button
          type="button"
          role="menuitem"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm text-destructive transition-colors
            cursor-pointer hover:bg-accent disabled:cursor-not-allowed disabled:opacity-50
          "
          [disabled]="isLoggingOut()"
          (click)="logout()"
        >
          <ng-icon name="lucideLogOut" size="18" aria-hidden="true" />
          {{ isLoggingOut() ? 'Logging out...' : 'Logout' }}
        </button>
      </div>
    </div>
  }
</div>
