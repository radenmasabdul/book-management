<header class="sticky top-0 z-50 border-b border-border bg-background">
  <div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <section>
      <app-header
        [isMobileMenuOpen]="isMobileMenuOpen()"
        (menuClick)="onMenuClick()"
        (brandClick)="closeMobileMenu()"
      />
    </section>

    <section>
      <app-navbar-actions/>
    </section>
  </div>

  @if (isMobileMenuOpen()) {
    <div class="border-t border-border bg-background px-4 py-3 lg:hidden">
      <app-mobile-nav (navigate)="closeMobileMenu()"/>
    </div>
  }
</header>
